syntax = "proto3";

package v1;

option go_package = "github.com/deziss/tasch/api/v1";

service SchedulerService {
  // Submit a job with a CEL requirement constraint
  rpc SubmitJob (SubmitJobRequest) returns (SubmitJobResponse);

  // Submit a distributed training job across multiple nodes
  rpc SubmitDistributedJob (SubmitDistributedJobRequest) returns (SubmitDistributedJobResponse);

  // Cancel a queued or running job
  rpc CancelJob (CancelJobRequest) returns (CancelJobResponse);

  // Get the status and result of a specific job
  rpc GetJobStatus (GetJobStatusRequest) returns (GetJobStatusResponse);

  // Stream execution logs back from a running or completed job
  rpc StreamLogs (LogStreamRequest) returns (stream LogMessage);

  // Retrieve the global queued tasks and active workers states
  rpc WorkerStatus (WorkerStatusRequest) returns (WorkerStatusResponse);

  // List all jobs in the queue with their states
  rpc ListJobs (ListJobsRequest) returns (ListJobsResponse);

  // Worker reports job completion/failure back to master
  rpc ReportResult (ReportResultRequest) returns (ReportResultResponse);

  // Report this master's role in the replicated cluster.
  //
  // Clients need it to find the master currently accepting writes: every master answers reads,
  // but only the leader accepts changes, and which one that is moves on failover.
  rpc ClusterStatus (ClusterStatusRequest) returns (ClusterStatusResponse);

  // Take a node out of, or back into, scheduling rotation.
  //
  // There was no way to stop a node receiving work for maintenance: an operator's only options
  // were to kill the worker, which fails every job running on it, or to wait. Cordoning stops
  // new dispatches while letting running jobs finish; draining additionally cancels them.
  rpc CordonNode (CordonNodeRequest) returns (CordonNodeResponse);

  // Worker confirms it has started a job.
  //
  // This replaces an unauthenticated HTTP POST to /acknowledge_start on the metrics port. That
  // endpoint mutated scheduler state with no authentication, so a caller could forge
  // acknowledgements for guessed job IDs and disarm the safety net that re-queues a dispatch
  // nothing picked up. It also required the worker to guess the master's metrics port from its
  // own config, so the handshake silently failed whenever the two differed.
  rpc AcknowledgeStart (AcknowledgeStartRequest) returns (AcknowledgeStartResponse);

  // Worker subscribes to the dispatches addressed to it.
  //
  // This replaces the ZeroMQ PUB/SUB bus, on which the master broadcast every job's command
  // and environment variables in cleartext to every subscriber, with per-node targeting
  // enforced only by the receiving worker. Anything that could reach the bus port could read
  // every credential the cluster dispatched. This stream carries only the calling node's work
  // and rides the same authenticated, optionally TLS-protected connection as everything else.
  rpc WatchDispatch (WatchDispatchRequest) returns (stream DispatchMessage);
}

message ClusterStatusRequest {}

message ClusterStatusResponse {
  bool is_leader = 1;
  string node_id = 2;
  string leader_id = 3;
  string leader_address = 4;
  bool ha_enabled = 5;
  repeated ClusterMember members = 6;
}

message ClusterMember {
  string node_id = 1;
  string address = 2;
  bool leader = 3;
  string suffrage = 4;   // Voter or Nonvoter
}

message CordonNodeRequest {
  string node_name = 1;
  bool cordon = 2;        // true to cordon, false to return the node to service
  bool drain = 3;         // also cancel the jobs currently running on the node
  string reason = 4;      // recorded and shown in `tasch nodes`
}

message CordonNodeResponse {
  string node_name = 1;
  bool cordoned = 2;
  int32 jobs_cancelled = 3;
  string message = 4;
}

message AcknowledgeStartRequest {
  string job_id = 1;
  string worker_node = 2;
  int64 attempt = 3;
}

message AcknowledgeStartResponse {
  bool acknowledged = 1;
}

message WatchDispatchRequest {
  string node_name = 1;

  // Jobs this worker is currently executing, sent every time the stream is established.
  //
  // A master restart used to mark every RUNNING job FAILED without contacting anyone. The
  // workers kept executing them, holding CPU and GPU that the new master's empty accounting
  // believed were free, so it immediately oversubscribed those nodes — and when a job finally
  // finished, its result was discarded because the master no longer had the job. Reporting what
  // is actually running lets the master adopt those jobs instead of guessing.
  repeated RunningJob running_jobs = 2;
}

// RunningJob identifies work a worker is executing, so the master can reconcile against it.
message RunningJob {
  string job_id = 1;
  int64 attempt = 2;      // Fencing token from the dispatch that started it
  int64 start_time = 3;
}

message DispatchMessage {
  string job_id = 1;
  string command = 2;
  int32 walltime_seconds = 3;
  string action = 4;                 // "execute" or "cancel"
  map<string, string> env_vars = 5;
  int64 attempt = 6;                 // Fencing token, echoed back in ReportResult

  // Resource reservations, so the worker can enforce them rather than leaving them as
  // bookkeeping on the master. A job that reserved one core could previously consume the whole
  // machine, because nothing on the worker ever applied a limit.
  int32 cpus_required = 7;
  int32 memory_required_mb = 8;
}

message SubmitJobRequest {
  string cel_requirement = 1;
  string command = 2;
  int32 priority = 3;                   // Lower = higher priority (default: 10)
  string user = 4;                      // For fairshare tracking
  int32 walltime_seconds = 5;           // Max execution time (0 = no limit)
  int32 gpus_required = 6;              // Number of GPUs needed (0 = none)
  map<string, string> env_vars = 7;     // Custom environment variables

  // Explicit resource reservations. Distinct from cel_requirement, which filters which nodes
  // are eligible: "ad.cpu_cores >= 4" asks for a node with at least 4 cores, it does not
  // reserve 4 of them. These were previously scraped out of the CEL string with a regex, so
  // any expression the regex did not literally match reserved nothing and the node was freely
  // oversubscribed. 0 falls back to that regex for backward compatibility.
  int32 cpus_required = 8;              // CPU cores to reserve (0 = infer from cel_requirement)
  int32 memory_required_mb = 9;         // Memory to reserve in MB (0 = infer)

  // Jobs that must finish before this one starts. Each must already exist, which is what makes
  // a dependency cycle impossible to express rather than something to detect.
  repeated string depends_on = 10;
  // Which outcome releases the job: afterok (default), afterany, afternotok.
  string dependency_mode = 11;

  // Array specification: "1-100", "1-100%5" to cap concurrency at 5, or an explicit list like
  // "1,4,7". Submitting once and letting the scheduler expand it is what lets it throttle the
  // tasks; a shell loop of submissions cannot be throttled by anything but the shell.
  string array = 12;
}

message SubmitJobResponse {
  string job_id = 1;
  string status = 2;

  // For an array submission: every task's ID, and the array they share. job_id carries the
  // first task, so a client that does not know about arrays still gets something usable.
  repeated string job_ids = 3;
  string array_id = 4;
}

message SubmitDistributedJobRequest {
  string cel_requirement = 1;           // Must match on ALL allocated nodes
  string command = 2;                   // Command template (same on all nodes)
  int32 num_nodes = 3;                  // How many nodes to allocate
  int32 gpus_per_node = 4;             // GPUs per node
  int32 priority = 5;
  string user = 6;
  int32 walltime_seconds = 7;
  int32 master_port = 8;               // DDP coordination port (default: 29500)
  map<string, string> env_vars = 9;    // Additional env vars for all ranks
}

message SubmitDistributedJobResponse {
  string group_id = 1;
  repeated string job_ids = 2;
  string status = 3;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  string job_id = 1;
  string status = 2;
  string message = 3;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id = 1;
  string state = 2;       // QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED
  string worker_node = 3;
  string command = 4;
  string output = 5;
  string error = 6;
  int64 submit_time = 7;
  int64 start_time = 8;
  int64 end_time = 9;
  string group_id = 10;   // Empty if not part of a distributed job

  repeated string depends_on = 11;
  string array_id = 12;
  int32 array_index = 13;
  // Why a queued job is not running yet: an unmet dependency, or its array's concurrency cap.
  // Empty when nothing is holding it back.
  string blocked_reason = 14;
}

message LogStreamRequest {
  string job_id = 1;
}

message LogMessage {
  int64 timestamp = 1;
  string level = 2;
  string message = 3;
  string job_id = 4;
}

message WorkerStatusRequest {}

message WorkerStatusResponse {
  map<string, string> worker_nodes = 1;          // node name -> ClassAd JSON
  map<string, NodeSchedulingState> node_state = 2;
}

// NodeSchedulingState describes why a node is or is not receiving work.
message NodeSchedulingState {
  bool cordoned = 1;
  string cordon_reason = 2;
  bool circuit_broken = 3;     // temporarily blocked after consecutive failures
  int32 running_jobs = 4;
  int32 gpus_allocated = 5;
}

message ListJobsRequest {
  string state_filter = 1; // Optional: filter by state

  // Pagination. The response previously carried every job in one message, which on a busy
  // cluster is both an unbounded allocation on the master and a response that can exceed gRPC's
  // receive limit, making the call fail outright rather than return a large result.
  int32 page_size = 2;     // 0 uses the server default; capped by the server maximum
  string page_token = 3;   // next_page_token from a previous response
}

message ListJobsResponse {
  repeated JobInfo jobs = 1;
  string next_page_token = 2;  // empty when this is the last page
  int32 total_matching = 3;    // jobs matching the filter, across all pages
}

message JobInfo {
  string job_id = 1;
  string state = 2;
  string command = 3;
  string requirement = 4;
  string worker_node = 5;
  int32 priority = 6;
  string user = 7;
  int64 submit_time = 8;
  string group_id = 9;
}

message ReportResultRequest {
  string job_id = 1;
  string worker_node = 2;
  bool success = 3;
  string output = 4;
  string error = 5;
  int64 start_time = 6;
  int64 end_time = 7;

  // Dispatch attempt this result belongs to, echoed back from the dispatch payload. The master
  // discards results from a stale attempt: without it, a late report from a previously
  // dispatched worker released the allocation belonging to whichever node is running the job
  // now, and no result could be told apart from a duplicate.
  int64 attempt = 8;
}

message ReportResultResponse {
  bool acknowledged = 1;
}
